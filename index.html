<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Brand surfaces (Atelier system — warm paper / warm ink) -->
  <meta name="theme-color" content="#F4F1E9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#15130D" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />

  <!-- Primary SEO (Arabic default; React swaps on language change) -->
  <title>أركان للحلول الذكية — البنية التي تقوم عليها عملياتك | أنظمة ذكاء اصطناعي للأعمال</title>
  <meta name="description" content="أركان تبني أنظمة الذكاء الاصطناعي التي تقوم عليها العمليات: وكلاء يتحدثون العربية، أتمتة موثوقة، وتكاملات تربط واتساب وأودو وشوبيفاي وأنظمتك في منظومة واحدة تعمل في الإنتاج. ابدأ بتقييم لأنظمتك." />
  <meta name="author" content="Arkan AI Solutions" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://arkan.ai/" />
  <link rel="alternate" hreflang="ar" href="https://arkan.ai/" />
  <link rel="alternate" hreflang="en" href="https://arkan.ai/?lang=en" />
  <link rel="alternate" hreflang="x-default" href="https://arkan.ai/" />

  <!-- Open Graph -->
  <meta property="og:site_name" content="Arkan AI Solutions" />
  <meta property="og:title" content="أركان للحلول الذكية — البنية التي تقوم عليها عملياتك" />
  <meta property="og:description" content="أنظمة ذكاء اصطناعي عربية أولاً، أتمتة وتكامل — مصممة ومبنية ومُشغّلة في الإنتاج عبر مصر والسعودية والإمارات." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://arkan.ai/" />
  <meta property="og:image" content="https://arkan.ai/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="ar_EG" />
  <meta property="og:locale:alternate" content="en_US" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Arkan AI Solutions — the structure your operations run on" />
  <meta name="twitter:description" content="Arabic-first AI systems, automation & integration — designed, built and operated in production across MENA." />
  <meta name="twitter:image" content="https://arkan.ai/og-image.png" />

  <!-- Fonts: Atelier dual-script stack.
       EN  Bricolage Grotesque (display) · Inter (text/UI/numerals)
       AR  Reem Kufi (display) · Readex Pro (text/UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Inter:wght@400;500;600;700&family=Reem+Kufi:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Boot: apply stored theme + language BEFORE first paint (no FOUC, no shift).
       Brand default is LIGHT (the warm-paper identity). -->
  <script>
    (function () {
      try {
        var qs = new URLSearchParams(location.search);
        var lang = qs.get("lang") || localStorage.getItem("arkan-lang") || "ar";
        if (lang !== "en") lang = "ar";
        var theme = localStorage.getItem("arkan-theme");
        if (theme !== "light" && theme !== "dark") theme = "light"; /* brand default */
        var d = document.documentElement;
        d.setAttribute("lang", lang);
        d.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
        d.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>

  <!-- Inline guard so the very first frame is on-brand -->
  <style>
    html { background: #F4F1E9; }
    html[data-theme="dark"] { background: #15130D; }
    body { margin: 0; }
  </style>

  <!-- Structured data: organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "Arkan AI Solutions",
    "alternateName": "أركان للحلول الذكية",
    "url": "https://arkan.ai/",
    "logo": "https://arkan.ai/favicon.svg",
    "image": "https://arkan.ai/og-image.png",
    "slogan": "The structure your operations run on.",
    "description": "Arabic-first AI agents, workflow automation, custom AI and systems integration — designed, built and operated in production for businesses across Egypt, Saudi Arabia and the UAE.",
    "areaServed": [
      { "@type": "Country", "name": "Egypt" },
      { "@type": "Country", "name": "Saudi Arabia" },
      { "@type": "Country", "name": "United Arab Emirates" }
    ],
    "knowsLanguage": ["ar", "en"],
    "email": "hello@arkan.ai",
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "sales",
      "email": "hello@arkan.ai",
      "availableLanguage": ["Arabic", "English"]
    },
    "makesOffer": [
      { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Arabic-first AI Agents" } },
      { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Workflow Automation" } },
      { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Custom AI Solutions" } },
      { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Systems Integration" } }
    ]
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
